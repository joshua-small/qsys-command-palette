name: Palette checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet run --project tests/Logic/Logic.csproj --configuration Release --artifacts-path artifacts/logic
  wpf:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet run --project tests/Wpf/Wpf.csproj --configuration Release --artifacts-path artifacts/wpf
